title: DCSync (replikacja haseł z DC)
id: ad-dcsync-001
status: experimental
description: Wykrywa DCSync - zdarzenie 4662 z DS-Replication-Get-Changes (kontrola dostepu).
author: redteam-ad-lab
date: 2026-08-16
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4662
        Properties|contains: 'DS-Replication-Get-Changes'
    filter:
        SubjectUserName|endswith: '$'
    condition: selection and not filter
level: critical
tags:
    - attack.credential_access
    - attack.t1003.006
