[libdefaults]
    default_realm = XMASK.LAB
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    XMASK.LAB = {
        kdc = dc01.xmask.lab
        admin_server = dc01.xmask.lab
    }

[domain_realm]
    .xmask.lab = XMASK.LAB
    xmask.lab = XMASK.LAB
