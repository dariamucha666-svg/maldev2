title: Backdoor EASports – Autostart Run Key Modified
id: 7c3a1b90-5e2f-4d11-9c4a-18e0b2d4a102
status: experimental
description: >
  Modyfikacja klucza autostartu Run (Security 4657). Wymaga auditowania
  Object Access na rejestrze — bez SACL to zdarzenie zwykle nie spadnie.
  Węższy filtr niż samo 'Run' (unikamy RuntimeBroker itd.).
references:
  - sha256:178cb931cc846c4ac7bbf2370259e8b9f7d8a45459974115818b5c1e608533c4
author: lab
date: 2026-08-14
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4657
    ObjectName|contains:
      - '\CurrentVersion\Run'
      - '\CurrentVersion\RunOnce'
  condition: selection
falsepositives:
  - Instalatory, które legalnie dopisują się do Run
level: medium
tags:
  - attack.persistence
  - attack.t1547.001

